services:
  - type: web
    name: gasagent-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: NREL_API_KEY
        sync: false
      - key: OCM_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
